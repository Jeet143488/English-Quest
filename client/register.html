<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | English Quest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="">
    <nav class="navbar py-3">
        <div class="container d-flex flex-wrap align-items-center gap-3">
            <a class="d-flex align-items-center gap-2 me-auto" href="../index.html"><span
                    class="brand-mark">EQ</span><span class="brand-name fs-5">English Quest</span></a>
            <div class="d-flex flex-wrap align-items-center gap-2"><a class="nav-link px-2"
                    href="../index.html">Home</a><a class="btn btn-primary btn-sm" href="login.html">Login</a></div>
        </div>
    </nav>
    <main class="container login-shell py-5">
        <div class="row justify-content-center w-100">
            <div class="col-lg-8">
                <div class="auth-card p-4 p-lg-5">
                    <div class="text-center mb-4"><span class="badge-soft">Create your student profile</span>
                        <h2 class="section-title mt-3">Start your English Quest</h2>
                        <p class="muted">A few details, then you can jump straight into practice.</p>
                    </div>
                    <div id="formMessage"></div>
                    <form id="registerForm" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="mb-3"><label class="form-label" for="fullName">Full name</label><input
                                        id="fullName" class="form-control" placeholder="Your name">
                                    <div class="invalid-feedback"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3"><label class="form-label" for="registerEmail">Email</label><input
                                        id="registerEmail" class="form-control" type="email"
                                        placeholder="you@example.com">
                                    <div class="invalid-feedback"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3"><label class="form-label"
                                        for="registerPassword">Password</label><input id="registerPassword"
                                        class="form-control" type="password" placeholder="At least 6 characters">
                                    <div class="invalid-feedback"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3"><label class="form-label" for="confirmPassword">Confirm
                                        password</label><input id="confirmPassword" class="form-control" type="password"
                                        placeholder="Type it again">
                                    <div class="invalid-feedback"></div>
                                </div>
                            </div>
                        </div><button type="submit" class="btn btn-primary w-100 mt-4">Create account</button>
                    </form>
                    <p class="text-center muted mt-4 mb-0">Already registered? <a href="login.html">Sign in</a></p>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer mt-5 py-4">
        <div class="container d-flex flex-wrap justify-content-between gap-2"><span>English Quest • Learn a little, use
                it a lot.</span><span>Learn. Practice. Improve. Communicate with Confidence.</span></div>
    </footer>
    <script src="../js/app.js"></script>
</body>

</html>
